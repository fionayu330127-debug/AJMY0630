<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 剪视频 · 奥吉米亚 ERP</title>
<style>
  :root{
    --navy-900:#0b1220;
    --navy-800:#111a2c;
    --navy-700:#182541;
    --teal-600:#0d9488;
    --teal-500:#14b8a6;
    --teal-50:#ecfdf9;
    --bg:#eef1f5;
    --card:#ffffff;
    --border:#e3e7ee;
    --ink-900:#0f172a;
    --ink-600:#475569;
    --ink-400:#94a3b8;
    --amber:#d97706;
    --rose:#e11d48;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);
    color:var(--ink-900);
    display:flex;
    height:100vh;
    overflow:hidden;
    font-size:14px;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:230px;
    flex-shrink:0;
    background:var(--navy-900);
    color:#cbd5e1;
    display:flex;
    flex-direction:column;
    height:100%;
    overflow-y:auto;
  }
  .brand{
    display:flex;align-items:center;gap:10px;
    padding:18px 18px 14px 18px;
    border-bottom:1px solid rgba(255,255,255,.06);
  }
  .brand-icon{
    width:32px;height:32px;border-radius:8px;
    background:linear-gradient(135deg,var(--teal-500),#0891b2);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:700;font-size:14px;flex-shrink:0;
  }
  .brand-name{font-size:14px;font-weight:700;color:#fff;line-height:1.3;}
  .brand-sub{font-size:11px;color:var(--ink-400);margin-top:1px;}
  .nav{padding:10px 10px;flex:1;}
  .nav-item{
    display:flex;align-items:center;gap:9px;
    padding:9px 10px;margin-bottom:2px;
    border-radius:8px;font-size:13.5px;color:#b6c0d1;
    cursor:pointer;user-select:none;
  }
  .nav-item:hover{background:rgba(255,255,255,.05);color:#fff;}
  .nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:.85;}
  .nav-group-label{
    padding:9px 10px 4px 10px;font-size:12px;color:#64748b;display:flex;align-items:center;gap:8px;
  }
  .nav-sub{padding-left:6px;margin-top:2px;margin-bottom:8px;border-left:1px solid rgba(255,255,255,.08);margin-left:16px;}
  .nav-sub .nav-item{padding-left:16px;font-size:13px;}
  .nav-item.active-parent{background:var(--navy-700);color:#fff;font-weight:600;}
  .nav-sub .nav-item.active{
    background:var(--teal-600);color:#fff;font-weight:600;
    box-shadow:0 1px 3px rgba(0,0,0,.2);
  }

  /* ---------- Top bar ---------- */
  .main{flex:1;display:flex;flex-direction:column;height:100%;overflow:hidden;}
  .topbar{
    background:var(--card);
    border-bottom:1px solid var(--border);
    padding:14px 26px;
    display:flex;align-items:center;justify-content:space-between;
    flex-shrink:0;
  }
  .topbar h1{font-size:17px;margin:0;font-weight:700;}
  .topbar .crumb{font-size:12px;color:var(--ink-400);margin-top:2px;}
  .topbar-right{display:flex;align-items:center;gap:10px;}
  .pill{
    display:flex;align-items:center;gap:6px;
    background:#f1f5f9;border-radius:999px;padding:5px 12px;font-size:12px;color:var(--ink-600);
  }
  .dot{width:6px;height:6px;border-radius:50%;background:#22c55e;}
  .avatar{
    width:30px;height:30px;border-radius:50%;background:var(--teal-50);color:var(--teal-600);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;
  }

  .content{flex:1;overflow-y:auto;padding:24px 26px 60px 26px;}
  .page{display:none;}
  .page.active{display:block;}

  h2.section-title{font-size:15px;font-weight:700;margin:0 0 2px 0;}
  p.section-desc{font-size:12.5px;color:var(--ink-400);margin:0 0 18px 0;}

  /* ---------- Buttons ---------- */
  .btn{
    border:none;cursor:pointer;font-size:13px;border-radius:8px;padding:8px 14px;
    display:inline-flex;align-items:center;gap:6px;font-weight:600;transition:filter .12s;
  }
  .btn:active{filter:brightness(.92);}
  .btn-primary{background:var(--teal-600);color:#fff;}
  .btn-primary:hover{background:#0f766e;}
  .btn-secondary{background:#fff;color:var(--ink-900);border:1px solid var(--border);}
  .btn-secondary:hover{background:#f8fafc;}
  .btn-ghost{background:transparent;color:var(--ink-600);}
  .btn-ghost:hover{background:#f1f5f9;}
  .btn-danger{background:#fff;color:var(--rose);border:1px solid #fecdd3;}
  .btn-sm{padding:5px 10px;font-size:12px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn svg{width:14px;height:14px;}

  /* ---------- Tabs ---------- */
  .tabs{display:flex;gap:4px;background:#e7eaf0;padding:3px;border-radius:9px;width:max-content;margin-bottom:18px;}
  .tab{padding:7px 16px;border-radius:7px;font-size:13px;font-weight:600;color:var(--ink-600);cursor:pointer;}
  .tab.active{background:#fff;color:var(--ink-900);box-shadow:0 1px 2px rgba(0,0,0,.08);}

  /* ---------- Cards / grids ---------- */
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .search{
    display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--border);
    border-radius:8px;padding:6px 10px;font-size:12.5px;color:var(--ink-400);width:220px;
  }
  .search input{border:none;outline:none;font-size:12.5px;width:100%;color:var(--ink-900);}
  .search svg{width:14px;height:14px;flex-shrink:0;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;}
  .card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    overflow:hidden;display:flex;flex-direction:column;
  }
  .thumb{
    height:106px;position:relative;display:flex;align-items:center;justify-content:center;color:#fff;
  }
  .thumb svg{width:26px;height:26px;opacity:.85;}
  .thumb .dur-badge{
    position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.55);color:#fff;
    font-size:10.5px;padding:2px 6px;border-radius:5px;
  }
  .thumb .check{
    position:absolute;top:7px;left:7px;width:19px;height:19px;border-radius:5px;
    background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;
  }
  .thumb .check svg{width:12px;height:12px;color:var(--teal-600);opacity:0;}
  .card.selected .thumb .check{background:var(--teal-600);}
  .card.selected .thumb .check svg{opacity:1;color:#fff;}
  .card.selected{outline:2px solid var(--teal-500);outline-offset:-1px;}
  .card-body{padding:10px 12px 12px 12px;}
  .card-name{font-size:12.5px;font-weight:600;color:var(--ink-900);margin-bottom:3px;line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;}
  .card-meta{font-size:11px;color:var(--ink-400);display:flex;justify-content:space-between;align-items:center;}
  .tag{
    display:inline-block;font-size:10.5px;padding:1.5px 7px;border-radius:5px;background:var(--teal-50);color:var(--teal-600);font-weight:600;
  }
  .card-actions{display:flex;gap:5px;margin-top:8px;}

  /* material grid variant selectable */
  .pick-card{cursor:pointer;}

  /* ---------- Music rows ---------- */
  .music-row{
    display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--border);
    border-radius:9px;padding:10px 14px;margin-bottom:8px;
  }
  .music-row.selected{outline:2px solid var(--teal-500);outline-offset:-1px;}
  .play-btn{
    width:32px;height:32px;border-radius:50%;background:var(--teal-50);color:var(--teal-600);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;border:none;
  }
  .play-btn svg{width:13px;height:13px;}
  .wave{flex:1;display:flex;align-items:center;gap:2px;height:22px;overflow:hidden;}
  .wave span{width:2.5px;background:#cbd5e1;border-radius:2px;flex-shrink:0;}
  .music-row.selected .wave span{background:var(--teal-500);}
  .music-info{width:150px;flex-shrink:0;}
  .music-name{font-size:12.5px;font-weight:600;}
  .music-sub{font-size:11px;color:var(--ink-400);margin-top:1px;}
  .music-dur{width:44px;flex-shrink:0;font-size:11.5px;color:var(--ink-400);text-align:right;}

  /* ---------- Empty state ---------- */
  .empty{
    text-align:center;padding:60px 20px;color:var(--ink-400);
  }
  .empty svg{width:38px;height:38px;margin-bottom:12px;opacity:.5;}
  .empty p{font-size:13px;margin:0 0 14px 0;}

  /* ---------- Folder grid ---------- */
  .folder-card{
    background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;
    display:flex;flex-direction:column;gap:10px;
  }
  .folder-card:hover{border-color:var(--teal-500);}
  .folder-top{display:flex;align-items:center;justify-content:space-between;}
  .folder-icon{width:34px;height:34px;border-radius:8px;background:#fff7ed;color:var(--amber);display:flex;align-items:center;justify-content:center;}
  .folder-icon svg{width:18px;height:18px;}
  .folder-name{font-size:13.5px;font-weight:700;}
  .folder-count{font-size:11.5px;color:var(--ink-400);}
  .new-folder-card{
    border:1.5px dashed #cbd5e1;background:transparent;border-radius:var(--radius);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    color:var(--ink-400);cursor:pointer;padding:20px;font-size:12.5px;font-weight:600;min-height:96px;
  }
  .new-folder-card:hover{border-color:var(--teal-500);color:var(--teal-600);}
  .new-folder-card svg{width:20px;height:20px;}

  .crumb-nav{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-400);margin-bottom:16px;}
  .crumb-nav .cur{color:var(--ink-900);font-weight:700;}
  .crumb-nav .back{cursor:pointer;color:var(--teal-600);font-weight:600;}

  /* ---------- Wizard ---------- */
  .stepper{display:flex;align-items:flex-start;margin-bottom:26px;max-width:760px;}
  .step{display:flex;flex-direction:column;align-items:center;flex:1;position:relative;}
  .step-circle{
    width:30px;height:30px;border-radius:50%;background:#fff;border:2px solid #d7dce3;
    display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:var(--ink-400);z-index:2;
  }
  .step.done .step-circle{background:var(--teal-600);border-color:var(--teal-600);color:#fff;}
  .step.current .step-circle{border-color:var(--teal-600);color:var(--teal-600);}
  .step-label{font-size:12px;margin-top:7px;color:var(--ink-400);font-weight:600;text-align:center;}
  .step.current .step-label,.step.done .step-label{color:var(--ink-900);}
  .step-line{
    position:absolute;top:15px;left:calc(-50% + 15px);width:calc(100% - 30px);height:2px;background:#d7dce3;z-index:1;
  }
  .step.done .step-line{background:var(--teal-600);}
  .step:first-child .step-line{display:none;}

  .wizard-panel{
    background:#fff;border:1px solid var(--border);border-radius:12px;padding:24px;max-width:900px;
  }
  .wizard-title{font-size:14.5px;font-weight:700;margin:0 0 4px 0;}
  .wizard-sub{font-size:12px;color:var(--ink-400);margin:0 0 18px 0;}
  textarea{
    width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:13px;
    font-family:inherit;resize:vertical;min-height:78px;color:var(--ink-900);outline:none;
  }
  textarea:focus{border-color:var(--teal-500);}
  .row{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap;}
  .num-input{
    width:64px;border:1px solid var(--border);border-radius:8px;padding:7px 8px;font-size:13px;text-align:center;outline:none;
  }
  .copy-list{margin-top:16px;display:flex;flex-direction:column;gap:8px;}
  .copy-item{
    display:flex;gap:10px;align-items:flex-start;background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:10px 12px;
  }
  .copy-idx{
    width:20px;height:20px;border-radius:5px;background:var(--teal-50);color:var(--teal-600);font-size:11px;font-weight:700;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;
  }
  .copy-text{
    flex:1;font-size:12.5px;line-height:1.55;border:none;background:transparent;outline:none;resize:none;font-family:inherit;color:var(--ink-900);
  }
  .copy-item .del{flex-shrink:0;cursor:pointer;color:var(--ink-400);background:none;border:none;padding:2px;}
  .copy-item .del:hover{color:var(--rose);}
  .copy-item .del svg{width:14px;height:14px;}

  .dur-options{display:flex;gap:8px;margin-top:10px;}
  .dur-opt{
    padding:7px 16px;border-radius:8px;border:1px solid var(--border);background:#fff;font-size:12.5px;font-weight:600;color:var(--ink-600);cursor:pointer;
  }
  .dur-opt.active{background:var(--teal-600);border-color:var(--teal-600);color:#fff;}

  .field-label{font-size:12.5px;font-weight:700;color:var(--ink-900);margin:18px 0 8px 0;display:flex;align-items:center;gap:6px;}
  .field-hint{font-size:11.5px;color:var(--ink-400);font-weight:500;}

  .wizard-footer{display:flex;justify-content:space-between;margin-top:24px;border-top:1px solid var(--border);padding-top:18px;}

  .plan-table{width:100%;border-collapse:collapse;margin-top:14px;font-size:12.5px;}
  .plan-table th{
    text-align:left;color:var(--ink-400);font-weight:600;font-size:11.5px;padding:6px 10px;border-bottom:1px solid var(--border);
  }
  .plan-table td{padding:9px 10px;border-bottom:1px solid #f1f5f9;vertical-align:top;}
  .plan-table tr:last-child td{border-bottom:none;}
  .mini-tag{font-size:10.5px;background:#f1f5f9;color:var(--ink-600);padding:1.5px 6px;border-radius:5px;display:inline-block;margin:1px 3px 1px 0;}

  .progress-wrap{margin-top:18px;}
  .progress-bar-bg{height:8px;background:#eef1f5;border-radius:99px;overflow:hidden;}
  .progress-bar-fg{height:100%;background:linear-gradient(90deg,var(--teal-500),var(--teal-600));width:0%;transition:width .25s;}
  .progress-status{font-size:12px;color:var(--ink-400);margin-top:8px;}

  .result-card{position:relative;}
  .result-card .thumb{cursor:default;}
  .result-badge{
    position:absolute;top:7px;right:7px;background:rgba(0,0,0,.5);color:#fff;font-size:10px;padding:2px 6px;border-radius:5px;
  }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:50;
  }
  .overlay.show{display:flex;}
  .modal{
    background:#fff;border-radius:12px;padding:22px;width:380px;max-width:90vw;box-shadow:0 20px 50px rgba(0,0,0,.25);
  }
  .modal h3{margin:0 0 4px 0;font-size:14.5px;}
  .modal p.sub{margin:0 0 16px 0;font-size:12px;color:var(--ink-400);}
  .modal input[type=text], .modal select{
    width:100%;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px;outline:none;margin-bottom:12px;font-family:inherit;
  }
  .modal input:focus, .modal select:focus{border-color:var(--teal-500);}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;}
  .drop-zone{
    border:1.5px dashed #cbd5e1;border-radius:9px;padding:22px;text-align:center;color:var(--ink-400);font-size:12.5px;margin-bottom:14px;cursor:pointer;
  }
  .drop-zone:hover{border-color:var(--teal-500);color:var(--teal-600);}
  .drop-zone svg{width:22px;height:22px;margin-bottom:6px;}

  .toast-stack{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:8px;z-index:80;}
  .toast{
    background:var(--navy-900);color:#fff;padding:10px 16px;border-radius:8px;font-size:12.5px;
    box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;align-items:center;gap:8px;
  }
  .toast svg{width:14px;height:14px;color:var(--teal-500);flex-shrink:0;}

  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:99px;}
  ::-webkit-scrollbar-track{background:transparent;}
</style>
<style>
  /* The ERP shell owns global navigation when this standalone module is embedded. */
  .sidebar,
  .topbar { display: none; }
  .main { width: 100%; }
  .content { padding: 20px 22px 48px; }

  @media (max-width: 720px) {
    .content { padding: 14px 12px 36px; }
  }
</style>
</head>
<body>

<!-- ============ SIDEBAR ============ -->
<div class="sidebar">
  <div class="brand">
    <div class="brand-icon">奥</div>
    <div>
      <div class="brand-name">奥吉米亚 ERP</div>
      <div class="brand-sub">AI 剪视频</div>
    </div>
  </div>
  <div class="nav">
    <div class="nav-item active-parent">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8Z"/></svg>
      AI 工作台
    </div>
    <div class="nav-sub">
      <div class="nav-item" data-page="draw">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5-9 9"/></svg>
        AI 做图
      </div>
      <div class="nav-item active-parent" data-toggle="mixGroup">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h4v4H4zM16 16h4v4h-4zM4 20l16-16"/></svg>
        AI 剪视频
      </div>
      <div class="nav-sub" id="mixGroup" style="margin-left:14px;">
        <div class="nav-item" data-page="materials">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          素材库
        </div>
        <div class="nav-item active" data-page="mix">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h4v4H4zM16 16h4v4h-4zM4 20l16-16"/></svg>
          AI 混剪
        </div>
        <div class="nav-item" data-page="products">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7 12 3l9 4-9 4-9-4Z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg>
          成品库
        </div>
      </div>
    </div>
    <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 2 8l10 6 10-6-10-6ZM2 16l10 6 10-6"/></svg>销售中心</div>
    <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4.5 5-6 8-6s6.5 1.5 8 6"/></svg>TK 达人管理中心</div>
    <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>运营中心</div>
  </div>
</div>

<!-- ============ MAIN ============ -->
<div class="main">
  <div class="topbar">
    <div>
      <h1 id="pageTitle">AI 混剪</h1>
      <div class="crumb" id="pageCrumb">AI 工作台 / AI 混剪</div>
    </div>
    <div class="topbar-right">
      <div class="pill"><span class="dot"></span>在线</div>
      <div class="avatar">余</div>
    </div>
  </div>

  <div class="content">

    <!-- ================= PAGE: AI 做图（原有功能，保持不变，此处仅作占位） ================= -->
    <div class="page" id="page-draw">
      <div style="background:#fff;border:1px solid var(--border);border-radius:12px;padding:70px 20px;text-align:center;">
        <div style="color:var(--teal-600);font-size:12.5px;font-weight:700;margin-bottom:6px;">AI 工作台</div>
        <div style="font-size:19px;font-weight:700;margin-bottom:8px;">AI 做图</div>
        <div style="color:var(--ink-400);font-size:13px;">该模块为原有功能，保持不变。</div>
      </div>
    </div>

    <!-- ================= PAGE: 素材库 ================= -->
    <div class="page" id="page-materials">

function waveBars(seed){
  let out='';
  for(let i=0;i<48;i++){

    out += `<span style="height:${h.toFixed(1)}px"></span>`;

  return out;
}

  document.querySelectorAll('.play-btn').forEach(b=>b.innerHTML = PLAY_ICON);

  const closers = ['真的闭眼入不踩雷。','评论区都在问链接。','建议直接冲。','越穿越上头。','性价比直接拉满。','谁买谁知道。'];
  const generated = [];
  for(let i=0;i<count;i++){
    const opener = openers[Math.floor(Math.random()*openers.length)];
    const closer = closers[Math.floor(Math.random()*closers.length)];
    let core = src.replace(/[。！]$/,'');
    if(core.length>28) core = core.slice(0,28)+'…';
    generated.push(opener + core + '，' + closer);
  }
  state.wizard.copies = state.wizard.copies.concat(generated);
  renderWizard();
  toast('AI 已生成 '+count+' 条新文案');
}
function updateCopy(i, val){ state.wizard.copies[i] = val; }
function deleteCopy(i){ state.wizard.copies.splice(i,1); renderWizard(); }
function addCopy(){ state.wizard.copies.push(''); renderWizard(); }

function bindMusicPicker(){

/* ---- Step 4: 生成 ---- */
function stepGenerateHtml(){
  const w = state.wizard;
  const videos = state.materials.video.filter(v=>w.selectedVideos.includes(v.id));
  const musics = state.materials.music.filter(m=>w.selectedMusic.includes(m.id));

  let plan = '';
  if(w.results.length===0){
    plan = `
      <div class="field-label">生成方案预览</div>
      <table class="plan-table">
        <tr><th style="width:32px;">#</th><th>文案</th><th style="width:230px;">匹配素材（AI 智能匹配，避免重复）</th><th style="width:90px;">背景音乐</th></tr>
        ${w.copies.map((c,i)=>{
          const assigned = assignVideosForIndex(i, videos, 3);
          const music = musics[i % musics.length];
          return `<tr>
            <td>${i+1}</td>
            <td>${c || '<span style="color:#cbd5e1">（空文案）</span>'}</td>
            <td>${assigned.map(v=>`<span class="mini-tag">${v.tag}</span>`).join('')}</td>
            <td>${music ? music.name.split(' - ')[0] : '-'}</td>
          </tr>`;
        }).join('')}
      </table>
      <div class="row" style="margin-top:16px;">
        <span class="field-hint">时长 ${w.duration} 秒 · 共将生成 ${w.copies.length} 支视频</span>
      </div>
      <div id="genProgressWrap"></div>
      <div class="wizard-footer">
        <button class="btn btn-secondary" onclick="prevStep()">上一步</button>
        <button class="btn btn-primary" id="genBtn" onclick="startGenerate()">${SPARK_ICON} 开始 AI 混剪</button>
      </div>
    `;
  } else {
    plan = `
      <div class="field-label">生成结果 <span class="field-hint">（共 ${w.results.length} 支，可预览、下载或保存到成品库）</span></div>
      <div class="grid">
        ${w.results.map((r,i)=>`
          <div class="card result-card">
            <div class="thumb" style="background:${colorFor(r.videoIds[0])}">
              ${VIDEO_ICON}
              <div class="result-badge">${r.duration}s</div>
            </div>
            <div class="card-body">
              <div class="card-name">${r.copy.slice(0,16)}${r.copy.length>16?'…':''}</div>
              <div class="card-meta"><span>${r.music}</span></div>
              <div class="card-actions">
                <button class="btn btn-secondary btn-sm" style="flex:1" onclick="openSaveModal(${i})">存入成品库</button>
                <button class="btn btn-secondary btn-sm">${DL_ICON}</button>
              </div>
            </div>
          </div>
        `).join('')}
      </div>
      <div class="wizard-footer">
        <button class="btn btn-secondary" onclick="resetGenerate()">重新配置方案</button>
        <button class="btn btn-primary" onclick="startNewMix()">${PLUS_ICON} 开始新的混剪任务</button>
      </div>
    `;
  }

  return `
    <div class="wizard-title">步骤四 · AI 混剪生成</div>
    <div class="wizard-sub">AI 会依据每条文案的语义，从已选素材中智能匹配镜头，尽量让素材在各视频间不重复复用，并为每支视频呈现不同的剪辑风格与转场节奏。</div>
    ${plan}
  `;
}

// deterministic-ish mock matching so results look consistent across renders
function assignVideosForIndex(i, videos, count){
  const out = [];
  for(let k=0;k<count && k<videos.length;k++){
    out.push(videos[(i*2+k) % videos.length]);
  }
  return out;
}

function startGenerate(){
  const w = state.wizard;
  const btn = document.getElementById('genBtn');
  btn.disabled = true;
  const wrap = document.getElementById('genProgressWrap');
  wrap.innerHTML = `
    <div class="progress-wrap">
      <div class="progress-bar-bg"><div class="progress-bar-fg" id="progFg"></div></div>
      <div class="progress-status" id="progStatus">正在初始化 AI 混剪任务…</div>
    </div>
  `;
  const statuses = ['正在解析文案语义…','正在智能匹配素材镜头…','正在按文案生成分镜脚本…','正在合成画面与背景音乐…','正在导出视频文件…'];
  let pct = 0;
  const timer = setInterval(()=>{
    pct += 100/statuses.length;
    const idx = Math.min(statuses.length-1, Math.floor(pct/(100/statuses.length)));
    document.getElementById('progFg').style.width = Math.min(pct,100)+'%';
    document.getElementById('progStatus').textContent = statuses[idx];
    if(pct>=100){
      clearInterval(timer);
      finishGenerate();
    }
  }, 550);

  // ---- REAL INTEGRATION POINT ----
  // Replace the setInterval mock above with a call to your generation API, e.g.:
  // const job = await api.createMixJob({ copies: w.copies, videoIds: w.selectedVideos, musicIds: w.selectedMusic, duration: w.duration });
  // then poll job status and populate w.results from the response.
}
function finishGenerate(){
  const w = state.wizard;
  const videos = state.materials.video.filter(v=>w.selectedVideos.includes(v.id));
  const musics = state.materials.music.filter(m=>w.selectedMusic.includes(m.id));
  w.results = w.copies.map((c,i)=>{
    const assigned = assignVideosForIndex(i, videos, 3);
    const music = musics[i % musics.length];
    return {
      copy: c,
      videoIds: assigned.map(v=>v.id),
      music: music ? music.name.split(' - ')[0] : '-',
      duration: w.duration
    };
  });
  renderWizard();
  toast('AI 混剪已完成，共生成 '+w.results.length+' 支视频');
}
function resetGenerate(){ state.wizard.results = []; renderWizard(); }
function startNewMix(){
  state.wizard = {step:1, sourceCopy:'', copies:[], selectedVideos:[], selectedMusic:[], duration:15, results:[]};
  renderWizard();
}

function nextStep(){ state.wizard.step = Math.min(4, state.wizard.step+1); renderWizard(); }
function prevStep(){ state.wizard.step = Math.max(1, state.wizard.step-1); renderWizard(); }

/* Save result to product library */
function openSaveModal(i){
  state.saveResultIndex = i;
  const sel = document.getElementById('saveFolderSelect');
  const names = Object.keys(state.products);
  sel.innerHTML = names.map(n=>`<option value="${n}">${n}</option>`).join('') + `<option value="__new__">+ 新建文件夹…</option>`;
  openModal('saveOverlay');
}
function confirmSaveResult(){
  const sel = document.getElementById('saveFolderSelect');
  let folder = sel.value;
  if(folder === '__new__'){
    folder = prompt('请输入新文件夹名称（产品名称）：');
    if(!folder) return;
    if(!state.products[folder]) state.products[folder] = [];
  }
  const r = state.wizard.results[state.saveResultIndex];
  const id = nextId++;
  state.products[folder].push({
    id, name: `混剪_${r.copy.slice(0,8)}_${id}.mp4`, dur: '0:'+String(r.duration).padStart(2,'0'),
    date: new Date().toISOString().slice(0,10)
  });
  closeModal('saveOverlay');
  toast('已保存到「'+folder+'」');
}
